databases:
  - name: mandalay-aqi-db
    databaseName: mandalay_aqi
    user: mandalay
    plan: basic-256mb
services:
  - type: web
    name: mandalay-aqi-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.lock.txt
    preDeployCommand: flask --app wsgi init-db && flask --app wsgi recalculate-cpcb
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandalay-aqi-db
          property: connectionString
      - key: REFRESH_TOKEN
        generateValue: true
      - key: PREDICTION_URL
        sync: false
      - key: PREDICTION_AQI_STANDARD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.14
  - type: cron
    name: mandalay-aqi-hourly
    runtime: python
    plan: starter
    schedule: "5 * * * *"
    buildCommand: pip install -r requirements.lock.txt
    startCommand: flask --app wsgi refresh-data
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandalay-aqi-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.14
