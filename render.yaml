databases:
  - name: mandalay-aqi-db
    databaseName: mandalay_aqi
    user: mandalay
    plan: basic-256mb
services:
  - type: web
    name: mandalay-aqi-dashboard
    branch: feature/mandalay-hardware-integration
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock.txt
    startCommand: bash scripts/start_web.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandalay-aqi-db
          property: connectionString
      - key: HARDWARE_TRANSPORT
        value: webhook
      - key: HARDWARE_WEBHOOK_TOKEN
        sync: false
      - key: MQTT_PUBLISH_USERNAME
        value: mandalay_esp32
      - key: MQTT_TOPIC_TEMPLATE
        value: aqi/{device_id}/readings
      - key: MANDALAY_DEVICE_IDS
        value: node1
      - key: HARDWARE_DEVICE_ID
        value: node1
      - key: HARDWARE_SAMPLE_SECONDS
        value: "900"
      - key: HARDWARE_STALE_SECONDS
        value: "1800"
      - key: REFRESH_TOKEN
        generateValue: true
      - key: PREDICTION_URL
        value: https://mandalay-aqi-prediction.onrender.com/prediction.html
      - key: PREDICTION_AQI_STANDARD
        value: cpcb-2014-rolling-v1
      - key: PYTHON_VERSION
        value: 3.12.14
