databases:
  - name: mandalay-aqi-db
    databaseName: mandalay_aqi
    user: mandalay
    plan: basic-256mb
services:
  - type: web
    name: mandalay-aqi-dashboard
    branch: main
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.lock.txt
    preDeployCommand: flask --app wsgi migrate-refresh && flask --app wsgi init-db && flask --app wsgi recalculate-cpcb
    startCommand: bash scripts/start_web.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandalay-aqi-db
          property: connectionString
      - key: REFRESH_TOKEN
        generateValue: true
      - key: PREDICTION_URL
        value: https://mandalay-aqi-prediction.onrender.com/prediction.html
      - key: PREDICTION_AQI_STANDARD
        value: cpcb-2014-rolling-v1
      - key: PYTHON_VERSION
        value: 3.12.14
  - type: cron
    name: mandalay-aqi-hourly
    branch: main
    runtime: python
    plan: starter
    schedule: "5 * * * *"
    buildCommand: pip install -r requirements.lock.txt
    startCommand: flask --app wsgi migrate-refresh && flask --app wsgi refresh-data
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandalay-aqi-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.14
