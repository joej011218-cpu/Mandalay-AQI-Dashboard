databases:
  - name: mandalay-aqi-db
    databaseName: mandalay_aqi
    user: mandalay
    plan: basic-256mb
services:
  - type: web
    name: mandalay-aqi-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.lock.txt
    preDeployCommand: flask --app wsgi init-db && flask --app wsgi recalculate-cpcb && flask --app wsgi migrate-hardware
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandalay-aqi-db
          property: connectionString
      - key: MANDALAY_DEVICE_IDS
        value: node1
      - key: HARDWARE_DEVICE_ID
        value: node1
      - key: HARDWARE_SAMPLE_SECONDS
        value: "900"
      - key: HARDWARE_STALE_SECONDS
        value: "1800"
      - key: REFRESH_TOKEN
        generateValue: true
      - key: PREDICTION_URL
        value: https://mandalay-aqi-prediction.onrender.com/prediction.html
      - key: PREDICTION_AQI_STANDARD
        value: cpcb-2014-rolling-v1
      - key: PYTHON_VERSION
        value: 3.12.14
  - type: cron
    name: mandalay-aqi-hourly
    runtime: python
    plan: starter
    schedule: "5 * * * *"
    buildCommand: pip install -r requirements.lock.txt
    startCommand: flask --app wsgi refresh-data
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandalay-aqi-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.14

  - type: worker
    name: mandalay-mqtt-ingestion
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.lock.txt
    startCommand: python mqtt_worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandalay-aqi-db
          property: connectionString
      - key: MANDALAY_DEVICE_IDS
        value: node1
      - key: HARDWARE_DEVICE_ID
        value: node1
      - key: HARDWARE_SAMPLE_SECONDS
        value: "900"
      - key: HARDWARE_STALE_SECONDS
        value: "1800"
      - key: MQTT_HOST
        value: p0fb61ec.ala.asia-southeast1.emqxsl.com
      - key: MQTT_PORT
        value: "8883"
      - key: MQTT_EXPECTED_USERNAME
        value: mandalay_worker
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_TOPIC_TEMPLATE
        value: aqi/{device_id}/readings
      - key: PYTHON_VERSION
        value: 3.12.14
